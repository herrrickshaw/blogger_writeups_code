name: Draft review

# A four-stage, chained review pipeline for pull requests touching out/ (new
# post drafts) or posts/ (published content) -- the same shape as an LLM
# prompt-chaining pipeline (each stage's scope is framed by the last):
#
#   Stage 1 (static rules)   -- consistency-check/checks.py's STATIC_RULES,
#                                including the JS-parse check, run against
#                                every changed out/**/*.html draft. This is
#                                the same check every post in this repo has
#                                been hand-run against before publishing.
#                                No model calls, no cost.
#   Stage 2 (content loss)   -- flags any changed posts/**/*.html or
#                                out/**/*.html file that shrank more than 8%
#                                vs. the PR's base ref -- the exact failure
#                                mode behind the 2026-08-07 WPI incident and
#                                the 2026-08-30 top-15-chemicals-for-import.html
#                                regression documented in CLAUDE.md. No model
#                                calls, no cost.
#   Stage 3 (fact-check)     -- consistency-check/pr_factcheck.py sends each
#                                changed out/**/*.html draft to Gemini,
#                                Mistral and OpenAI independently (whichever
#                                have keys configured -- see Secrets below),
#                                reusing tools/multi_model_factcheck.py's
#                                proven prompt and request patterns, pointed
#                                at drafts before they're merged instead of
#                                published posts after the fact. Findings are
#                                always advisory (CLAUDE.md rule 3: "model
#                                output is not a verified fact") -- this stage
#                                can never fail the check, only add a section
#                                to the PR comment.
#   Stage 4 (routing)        -- this workflow: posts (or updates) a single PR
#                                comment combining stages 1-3, and fails the
#                                check only on a BLOCKER-severity static rule
#                                from stage 1 -- content loss, fact-check
#                                findings, and MINOR/MAJOR static-rule findings
#                                are surfaced for a human to weigh, not gated
#                                on.
#
# Secrets (optional, stage 3 only -- everything else runs with none of these
# set): add GEMINI_API_KEY, MISTRAL_API_KEY and/or OPENAI_API_KEY as
# repository secrets (Settings -> Secrets and variables -> Actions) to enable
# fact-checking. Any subset works -- a provider with no key configured is
# skipped, not treated as a failure. None of these secrets are readable by
# tools/blogger_api.py or tools/snapshot.py; this workflow's permissions
# block below has no access to the live blog either way.
#
# This workflow is read-only against the live blog: it never runs
# tools/blogger_api.py or tools/snapshot.py, and never writes to posts/ or
# meta/. Publishing stays a manual, OAuth-authorised action from a
# maintainer's own machine, per CLAUDE.md rule 4.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "out/**"
      - "posts/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A second push to the same PR supersedes the review in flight -- only the
  # latest commit's findings are worth having.
  group: draft-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Every PR in this repo is opened as a draft awaiting maintainer review
    # (see the wine/LNG/BrandSafway/canopy PRs) -- draft status is the normal
    # state to review in, not a reason to skip.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest ships Node.js already; this is just a sanity check so
      # a missing runtime shows up as a clear log line, not a silently
      # skipped js-parses rule (see pr_review.py's node_check_for docstring).
      - name: Confirm node is available
        run: node --version

      - name: "Stage 1-2: static rules + content loss"
        id: review
        run: |
          set +e
          python3 consistency-check/pr_review.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            > review.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Stage 3: cross-vendor fact-check (advisory only)"
        id: factcheck
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 consistency-check/pr_factcheck.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            > factcheck.md
          cat factcheck.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Stage 4: post the combined review as a PR comment"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            const factcheck = fs.readFileSync('factcheck.md', 'utf8');
            const marker = '<!-- draft-review-bot -->';
            const full = `${marker}\n### Draft review\n\n${review}\n\n---\n\n### Cross-vendor fact-check\n\n${factcheck}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: full,
              });
            }

      - name: Fail on BLOCKER-severity findings
        if: steps.review.outputs.status != '0'
        run: |
          echo "A BLOCKER-severity static rule failed -- see the PR comment above."
          exit 1
